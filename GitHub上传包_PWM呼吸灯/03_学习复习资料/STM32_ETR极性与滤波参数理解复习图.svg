<text x="740" y="1080" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">0</text>
<text x="822" y="1080" font-size="28" fill="#ad591b" font-weight="500" text-anchor="start">只有连续 2 个 1 → 不承认变高</text>
<text x="86" y="1167" font-size="28" fill="#087a70" font-weight="700" text-anchor="start">稳定变化</text>
<rect x="265" y="1126" width="62" height="57" rx="9" fill="#e9eef4" stroke="none" stroke-width="2"/>
