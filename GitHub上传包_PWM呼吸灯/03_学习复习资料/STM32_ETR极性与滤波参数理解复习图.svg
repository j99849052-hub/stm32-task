<text x="444" y="1165" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">1</text>
<rect x="487" y="1126" width="62" height="57" rx="9" fill="#dff3ee" stroke="none" stroke-width="2"/>
<text x="518" y="1165" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">1</text>
