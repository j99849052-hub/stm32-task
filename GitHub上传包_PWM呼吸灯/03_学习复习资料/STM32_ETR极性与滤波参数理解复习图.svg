<text x="592" y="1080" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">0</text>
<rect x="635" y="1041" width="62" height="57" rx="9" fill="#e9eef4" stroke="none" stroke-width="2"/>
<text x="666" y="1080" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">0</text>
