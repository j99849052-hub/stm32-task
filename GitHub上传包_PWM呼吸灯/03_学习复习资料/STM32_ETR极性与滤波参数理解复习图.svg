<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2660" viewBox="0 0 1600 2660"><title>STM32 ETR外部时钟计数：极性与滤波参数复习图</title><desc>极性选择计数边沿；滤波通过连续采样确认电平变化。含波形、十六档参数表、采样时钟和标准库配置示例。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1600" height="2660" rx="0" fill="#f4f7fb" stroke="#f4f7fb" stroke-width="2"/>
<text x="64" y="82" font-size="51" fill="#16334b" font-weight="700" text-anchor="start">极性与滤波 · 参数理解复习图</text>
<text x="64" y="130" font-size="27" fill="#50687b" font-weight="400" text-anchor="start">STM32F103C8T6  /  STM32F10x 标准库  /  ETR 外部时钟计数场景</text>
<rect x="64" y="168" width="1472" height="130" rx="16" fill="#e8f3ff" stroke="#cbdff2" stroke-width="2"/>
<text x="94" y="218" font-size="37" fill="#2267ac" font-weight="700" text-anchor="start">极性：以对应电平变化的边沿为计数节拍。</text>
<text x="94" y="266" font-size="34" fill="#087a70" font-weight="700" text-anchor="start">滤波：连续采样确认电平稳定后，才承认这次变化。</text>
<text x="64" y="365" font-size="35" fill="#2267ac" font-weight="700" text-anchor="start">01  极性 Polarity：选择“数哪一种边沿”</text>
<text x="64" y="406" font-size="27" fill="#50687b" font-weight="400" text-anchor="start">TIM_ExtTRGPolarity = External Trigger Polarity，外部触发极性</text>
<rect x="64" y="432" width="1472" height="193" rx="16" fill="#ffffff" stroke="#d4e0e9" stroke-width="2"/>
<text x="92" y="478" font-size="27" fill="#16334b" font-weight="400" text-anchor="start">输入引脚</text>
<text x="92" y="518" font-size="24" fill="#50687b" font-weight="400" text-anchor="start">高 1 / 低 0</text>
<path d="M320 556 H470 V485 H650 V556 H830 V485 H1010 V556 H1190 V485 H1370 V556 H1490" fill="none" stroke="#16334b" stroke-width="4"/>
<path d="M470 447 V476" fill="none" stroke="#2267ac" stroke-width="3"/>
<path d="M463 464 L470 476 L477 464" fill="none" stroke="#2267ac" stroke-width="3"/>
<text x="470" y="600" font-size="23" fill="#2267ac" font-weight="500" text-anchor="middle">↑ 上升沿</text>
<path d="M650 447 V476" fill="none" stroke="#ad591b" stroke-width="3"/>
<path d="M643 464 L650 476 L657 464" fill="none" stroke="#ad591b" stroke-width="3"/>
<text x="650" y="600" font-size="23" fill="#ad591b" font-weight="500" text-anchor="middle">↓ 下降沿</text>
<path d="M830 447 V476" fill="none" stroke="#2267ac" stroke-width="3"/>
<path d="M823 464 L830 476 L837 464" fill="none" stroke="#2267ac" stroke-width="3"/>
<text x="830" y="600" font-size="23" fill="#2267ac" font-weight="500" text-anchor="middle">↑ 上升沿</text>
<path d="M1010 447 V476" fill="none" stroke="#ad591b" stroke-width="3"/>
<path d="M1003 464 L1010 476 L1017 464" fill="none" stroke="#ad591b" stroke-width="3"/>
<text x="1010" y="600" font-size="23" fill="#ad591b" font-weight="500" text-anchor="middle">↓ 下降沿</text>
<path d="M1190 447 V476" fill="none" stroke="#2267ac" stroke-width="3"/>
<path d="M1183 464 L1190 476 L1197 464" fill="none" stroke="#2267ac" stroke-width="3"/>
<text x="1190" y="600" font-size="23" fill="#2267ac" font-weight="500" text-anchor="middle">↑ 上升沿</text>
<path d="M1370 447 V476" fill="none" stroke="#ad591b" stroke-width="3"/>
<path d="M1363 464 L1370 476 L1377 464" fill="none" stroke="#ad591b" stroke-width="3"/>
<text x="1370" y="600" font-size="23" fill="#ad591b" font-weight="500" text-anchor="middle">↓ 下降沿</text>
<rect x="64" y="645" width="724" height="128" rx="16" fill="#eaf3ff" stroke="#d4e0e9" stroke-width="2"/>
<text x="86" y="681" font-size="26" fill="#2267ac" font-weight="700" text-anchor="start">TIM_ExtTRGPolarity_NonInverted</text>
<text x="86" y="720" font-size="29" fill="#2267ac" font-weight="500" text-anchor="start">不反相 · 上升沿有效 · 0 → 1</text>
<text x="86" y="753" font-size="24" fill="#50687b" font-weight="400" text-anchor="start">宏的编码：0x0000；优先填宏，不背硬编码。</text>
<rect x="812" y="645" width="724" height="128" rx="16" fill="#fff2e7" stroke="#d4e0e9" stroke-width="2"/>
<text x="834" y="681" font-size="26" fill="#ad591b" font-weight="700" text-anchor="start">TIM_ExtTRGPolarity_Inverted</text>
<text x="834" y="720" font-size="29" fill="#ad591b" font-weight="500" text-anchor="start">反相 · 下降沿有效 · 1 → 0</text>
<text x="834" y="753" font-size="24" fill="#50687b" font-weight="400" text-anchor="start">宏的编码：0x8000；优先填宏，不背硬编码。</text>
<text x="64" y="813" font-size="26" fill="#50687b" font-weight="400" text-anchor="start">“有效”＝这种边沿可参与计数；不是让引脚主动输出高电平或低电平。</text>
<text x="64" y="852" font-size="26" fill="#50687b" font-weight="400" text-anchor="start">保持高或低不持续计数；Inverted 不能用数字 1 代替。其他触发模式需另看电平含义。</text>
<text x="64" y="930" font-size="35" fill="#2267ac" font-weight="700" text-anchor="start">02  滤波 Filter：检查“这次变化稳不稳定”</text>
<text x="64" y="972" font-size="27" fill="#50687b" font-weight="400" text-anchor="start">ExtTRGFilter = External Trigger Filter，外部触发滤波配置</text>
<text x="64" y="1013" font-size="28" fill="#16334b" font-weight="400" text-anchor="start">示例：滤波输出原先为 0，N＝4；连续采到 4 个新电平 1，才承认变高。</text>
<text x="86" y="1082" font-size="28" fill="#ad591b" font-weight="700" text-anchor="start">短毛刺</text>
<rect x="265" y="1041" width="62" height="57" rx="9" fill="#e9eef4" stroke="none" stroke-width="2"/>
<text x="296" y="1080" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">0</text>
