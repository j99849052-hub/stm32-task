<text x="64" y="1883" font-size="25" fill="#50687b" font-weight="400" text-anchor="start">0x00：不作连续 N 次滤波确认，手册注明仍按 fDTS 采样。0x0F＝15，不是 15 ms。</text>
<text x="64" y="1923" font-size="25" fill="#50687b" font-weight="400" text-anchor="start">这里直接传编号 0～15；不要自己移位成 0x0F00，也不要把它理解成“滤波强度百分比”。</text>
<text x="64" y="1990" font-size="35" fill="#2267ac" font-weight="700" text-anchor="start">04  采样时钟怎么来？不要与计数分频混淆</text>
<rect x="64" y="2015" width="1472" height="183" rx="16" fill="#ffffff" stroke="#d4e0e9" stroke-width="2"/>
<text x="88" y="2055" font-size="26" fill="#16334b" font-weight="400" text-anchor="start">CK_INT：Internal Clock，内部时钟；这里 INT 是 Internal（内部），不是中断。</text>
<text x="88" y="2094" font-size="26" fill="#16334b" font-weight="400" text-anchor="start">fDTS：手册中的滤波 / 死区时基频率；f 表示频率，不编造逐字母英文展开。</text>
<text x="88" y="2133" font-size="26" fill="#16334b" font-weight="400" text-anchor="start">TIM_CKD_DIV1 / DIV2 / DIV4：使 fDTS 分别等于 fCK_INT / 1、/ 2、/ 4。</text>
<text x="88" y="2172" font-size="26" fill="#16334b" font-weight="400" text-anchor="start">CKD＝Clock Division，时钟分频；不是 PSC（Prescaler，预分频器）。</text>
<text x="64" y="2242" font-size="30" fill="#2267ac" font-weight="700" text-anchor="start">算例：内部时钟 72 MHz、CKD 不分频、Filter＝0x0F</text>
<text x="64" y="2285" font-size="25" fill="#16334b" font-weight="400" text-anchor="start">采样频率＝72 MHz ÷ 32＝2.25 MHz；N＝8；验证时间尺度约 8 ÷ 2.25 MHz＝3.56 μs。</text>
<text x="64" y="2325" font-size="25" fill="#ad591b" font-weight="500" text-anchor="start">这是估算，不是精确延迟或保证门限；0x0F 不能直接代替机械按键的毫秒级消抖。</text>
<text x="64" y="2391" font-size="35" fill="#2267ac" font-weight="700" text-anchor="start">05  标准库配置示例：下降沿＋第 15 档滤波</text>
<rect x="64" y="2415" width="1472" height="86" rx="16" fill="#e8f3ff" stroke="#cbdff2" stroke-width="2"/>
<text x="88" y="2467" font-size="25" fill="#2267ac" font-weight="500" text-anchor="start">TIM_ETRClockMode2Config(TIM2, TIM_ExtTRGPSC_OFF, TIM_ExtTRGPolarity_Inverted, 0x0F);</text>
<text x="64" y="2544" font-size="25" fill="#16334b" font-weight="400" text-anchor="start">外部预分频关闭且 PSC＝0、定时器启动并向上计数时：每个确认的有效边沿使 CNT 加 1。</text>
<text x="64" y="2584" font-size="25" fill="#50687b" font-weight="400" text-anchor="start">CNT＝Counter，计数器；加 1 不等于立即中断。此示例仅配置 ETR 路径，不是完整初始化。</text>
<text x="64" y="2627" font-size="21" fill="#50687b" font-weight="400" text-anchor="start">依据：ST RM0008 · TIMx_SMCR 的 ETP / ETF 与 TIMx_CR1 的 CKD；昨日记录 2026-10-19 → 整理 2026-10-20</text>
</g></svg>