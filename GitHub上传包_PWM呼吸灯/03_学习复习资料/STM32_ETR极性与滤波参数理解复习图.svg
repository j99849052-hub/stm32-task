<text x="666" y="1165" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">1</text>
<path d="M666 1097 V1122" fill="none" stroke="#087a70" stroke-width="3"/>
<path d="M659 1110 L666 1122 L673 1110" fill="none" stroke="#087a70" stroke-width="3"/>
<rect x="709" y="1126" width="62" height="57" rx="9" fill="#dff3ee" stroke="none" stroke-width="2"/>
<text x="740" y="1165" font-size="31" fill="#16334b" font-weight="500" text-anchor="middle">1</text>
<text x="822" y="1165" font-size="28" fill="#087a70" font-weight="500" text-anchor="start">第 4 个连续的 1 → 承认变高</text>
<text x="64" y="1234" font-size="28" fill="#087a70" font-weight="700" text-anchor="start">N 是对同一段电平的连续采样次数，不是“收到 N 个外部脉冲才计一次”。</text>
<text x="64" y="1276" font-size="25" fill="#50687b" font-weight="400" text-anchor="start">采样变慢 / N 增多：确认通常更久，能拒绝短毛刺，但延迟变大、窄脉冲也可能漏掉。</text>
<text x="64" y="1353" font-size="35" fill="#2267ac" font-weight="700" text-anchor="start">03  滤波编号 0～15：每档＝采样频率＋连续确认次数 N</text>
