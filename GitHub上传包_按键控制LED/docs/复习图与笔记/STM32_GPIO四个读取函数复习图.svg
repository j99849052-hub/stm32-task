<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1770" viewBox="0 0 1600 1770" role="img" aria-labelledby="title desc">
  <title id="title">STM32 GPIO 四个读取函数复习图</title>
  <desc id="desc">用输入或输出、单个引脚或整个端口组成二乘二对照图，解释四个标准外设库读取函数的参数、返回值、IDR和ODR区别，并结合PE2上拉按键和PE0低电平LED举例。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #182433; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #526174; }
      .head { font-size: 27px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 21px; fill: #435266; }
      .code { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 23px; }
      .function { font-family: Consolas, monospace; font-size: 28px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
      .blueText { fill: #1d5eaa; }
      .greenText { fill: #20754c; }
      .white { fill: #ffffff; }
      .line { stroke: #718198; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .rule { stroke: #d3dce7; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#718198"/>
    </marker>
  </defs>

  <rect width="1600" height="1770" fill="#ffffff"/>
  <rect x="64" y="40" width="359" height="36" rx="18" fill="#eaf0f7"/>
  <text x="83" y="65" class="label">STM32F10x · 标准外设库 SPL</text>
  <text x="64" y="133" class="title">GPIO 四个读取函数，一张图分清</text>
  <text x="64" y="173" class="subtitle">先看 Input / Output：读哪种数据？再看有没有 Bit：读几个引脚？</text>

  <rect x="64" y="207" width="720" height="62" rx="14" fill="#273b58"/>
  <rect x="816" y="207" width="720" height="62" rx="14" fill="#273b58"/>
  <text x="424" y="247" class="head white" text-anchor="middle">带 Bit：读单个引脚</text>
  <text x="1176" y="247" class="head white" text-anchor="middle">不带 Bit：读整个端口的 16 位数据</text>

  <rect x="64" y="289" width="720" height="332" rx="18" fill="#edf5ff" stroke="#94b9e9" stroke-width="2"/>
  <rect x="816" y="289" width="720" height="332" rx="18" fill="#edf5ff" stroke="#94b9e9" stroke-width="2"/>
  <text x="92" y="328" class="label blueText">① INPUT · 输入 · 单引脚</text>
  <text x="92" y="371" class="function blueText">GPIO_ReadInputDataBit</text>
  <text x="92" y="414" class="body">读 IDR 中指定的一位：这个引脚读到 0 还是 1？</text>
  <text x="92" y="453" class="small">参数：GPIOx 端口 ＋ GPIO_Pin 单个引脚掩码</text>
  <text x="92" y="487" class="body">返回：uint8_t，数值为 0 或 1</text>
  <line x1="92" y1="507" x2="756" y2="507" class="rule"/>
  <text x="92" y="545" class="code">GPIO_ReadInputDataBit(GPIOE, GPIO_Pin_2)</text>
  <text x="92" y="587" class="small">例：PE2 上拉按键接 GND → 松开读 1，按下读 0</text>

  <text x="844" y="328" class="label blueText">② INPUT · 输入 · 整个端口</text>
  <text x="844" y="371" class="function blueText">GPIO_ReadInputData</text>
  <text x="844" y="414" class="body">读 IDR 的低 16 位：一次取得整组输入数据。</text>
  <text x="844" y="453" class="small">参数：只有 GPIOx 端口，不指定某个引脚</text>
  <text x="844" y="487" class="body">返回：uint16_t，范围 0x0000～0xFFFF</text>
  <line x1="844" y1="507" x2="1508" y2="507" class="rule"/>
  <text x="844" y="545" class="code">GPIO_ReadInputData(GPIOE)</text>
  <text x="844" y="587" class="small">结果 bit0～bit15 分别对应 PE0～PE15 的输入位。</text>

  <rect x="64" y="647" width="720" height="332" rx="18" fill="#edf8f1" stroke="#91c5a4" stroke-width="2"/>
  <rect x="816" y="647" width="720" height="332" rx="18" fill="#edf8f1" stroke="#91c5a4" stroke-width="2"/>
  <text x="92" y="686" class="label greenText">③ OUTPUT · 输出 · 单引脚</text>
  <text x="92" y="729" class="function greenText">GPIO_ReadOutputDataBit</text>
  <text x="92" y="772" class="body">读 ODR 中指定的一位：该输出数据位是 0 还是 1？</text>
  <text x="92" y="811" class="small">参数：GPIOx 端口 ＋ GPIO_Pin 单个引脚掩码</text>
  <text x="92" y="845" class="body">返回：uint8_t，数值为 0 或 1</text>
  <line x1="92" y1="865" x2="756" y2="865" class="rule"/>
  <text x="92" y="903" class="code">GPIO_ReadOutputDataBit(GPIOE, GPIO_Pin_0)</text>
  <text x="92" y="945" class="small">例：先对 PE0 执行 ResetBits → 这里读回 0</text>

  <text x="844" y="686" class="label greenText">④ OUTPUT · 输出 · 整个端口</text>
  <text x="844" y="729" class="function greenText">GPIO_ReadOutputData</text>
  <text x="844" y="772" class="body">读 ODR 的低 16 位：一次取得整组输出设定值。</text>
  <text x="844" y="811" class="small">参数：只有 GPIOx 端口，不指定某个引脚</text>
  <text x="844" y="845" class="body">返回：uint16_t，范围 0x0000～0xFFFF</text>
  <line x1="844" y1="865" x2="1508" y2="865" class="rule"/>
  <text x="844" y="903" class="code">GPIO_ReadOutputData(GPIOE)</text>
  <text x="844" y="945" class="small">结果 bit0～bit15 分别对应 PE0～PE15 的 ODR 位。</text>

  <rect x="64" y="1007" width="1472" height="260" rx="18" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="1051" class="head">最重要的区别：IDR 读输入采样，ODR 读输出锁存值</text>

  <rect x="92" y="1076" width="210" height="57" rx="12" fill="#e3edfa"/>
  <text x="197" y="1113" class="body" text-anchor="middle">外部按键 / 电路</text>
  <path d="M316 1105 L365 1105" class="line"/>
  <rect x="382" y="1076" width="240" height="57" rx="12" fill="#e3edfa"/>
  <text x="502" y="1113" class="body" text-anchor="middle">引脚数字输入采样</text>
  <path d="M636 1105 L685 1105" class="line"/>
  <rect x="702" y="1076" width="180" height="57" rx="12" fill="#3675c2"/>
  <text x="792" y="1113" class="head white" text-anchor="middle">IDR</text>
  <path d="M896 1105 L945 1105" class="line"/>
  <text x="969" y="1113" class="code blueText">ReadInputData / ReadInputDataBit</text>

  <rect x="92" y="1150" width="210" height="57" rx="12" fill="#e2f0e8"/>
  <text x="197" y="1187" class="body" text-anchor="middle">程序写入输出值</text>
  <path d="M316 1179 L365 1179" class="line"/>
  <rect x="382" y="1150" width="240" height="57" rx="12" fill="#32805a"/>
  <text x="502" y="1187" class="head white" text-anchor="middle">ODR</text>
  <path d="M636 1179 L685 1179" class="line"/>
  <text x="710" y="1187" class="code greenText">ReadOutputData / ReadOutputDataBit</text>
  <text x="92" y="1241" class="small">ODR 再经输出驱动影响引脚；读回 ODR，并不等于测到了引脚的实际电压。</text>

  <rect x="64" y="1293" width="1472" height="179" rx="18" fill="#fff7e6" stroke="#e4bd67" stroke-width="2"/>
  <text x="92" y="1337" class="head">整端口返回值怎么拆开看？</text>
  <text x="92" y="1377" class="code">portValue = GPIO_ReadInputData(GPIOE);</text>
  <text x="92" y="1415" class="body">假设返回 0x0004，也就是 0000 0000 0000 0100：bit2 = 1，其余位为 0。</text>
  <text x="92" y="1450" class="code">(portValue &amp; GPIO_Pin_2) != 0</text>
  <text x="645" y="1450" class="small">→ 判断 PE2 对应输入位是否为 1</text>

  <rect x="64" y="1498" width="1472" height="193" rx="18" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="1542" class="head">四个易混点</text>
  <text x="92" y="1583" class="body">① 这四个都是“读”，不会设置输出电平；设置电平用 SetBits / ResetBits 等。</text>
  <text x="92" y="1622" class="body">② uint8_t 不代表读 8 个引脚；Bit 版只返回 0 / 1；整端口版才返回 16 位数据。</text>
  <text x="92" y="1661" class="body">③ GPIO_Pin_2 是掩码 0x0004，不是数字 2。　④ 低电平点亮的 LED：0 反而表示亮。</text>

  <text x="64" y="1735" class="small">口诀：Input 看 IDR，Output 看 ODR；有 Bit 看一位，无 Bit 看一组。使用前先开时钟、正确配置引脚。</text>
</svg>
